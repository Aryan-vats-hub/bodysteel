<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Steel Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white flex items-center justify-center min-h-screen px-4">
    <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl max-w-sm w-full shadow-2xl">
        <h2 class="text-2xl font-black text-amber-500 uppercase tracking-wide text-center">Body Steel</h2>
        <p class="text-zinc-400 text-sm text-center mt-1">Owner Access Verification</p>
        
        {% if error %}
        <p class="text-red-500 text-xs text-center mt-3 bg-red-500/10 py-1.5 rounded">{{ error }}</p>
        {% endif %}

        <form method="POST" class="mt-6 space-y-4">
            <div>
                <label class="text-xs uppercase tracking-wider text-zinc-400 font-bold block mb-1">Enter Master Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-amber-500">
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-black font-extrabold py-3 rounded-lg text-sm transition">Login</button>
        </form>
    </div>
</body>
</html>
